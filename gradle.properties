## Gradle
org.gradle.jvmargs = -Xmx2G
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true

## Minecraft / NeoForge
minecraft_version       = 1.21.1
minecraft_version_range = [1.21.1, 1.22)
# 21.1.249 is the newest release on maven.neoforged.net that resolves. The bump
# off 21.1.230 is forced by the gametest runtime set: petrolpark 1.5.6 declares
# neoforge [21.1.238,) and thermoo-patches declares [21.1.233,), so a runtime
# built on 21.1.230 refuses to load them.
neo_version             = 21.1.249
neo_version_range       = [21.1.238,)
loader_version_range    = [4,)

parchment_minecraft_version = 1.21.1
parchment_mappings_version  = 2024.11.17

## Create stack
# Only needed because Power Grid's and Destroy's classes we compile against
# reference Create types (SmartBlockEntity, BlockEntityBehaviour, ...).
create_version    = 6.0.10-280
ponder_version    = 1.0.82
flywheel_version  = 1.0.6
registrate_version = MC1.21-1.3.0+67

## Dependencies -- Modrinth version ids (verified 2026-09-04)
# thermoo 4.8.1-neoforge (1.21.1)
thermoo_version = T0vIbHHv
# forgified-fabric-api 0.116.15+2.3.5+1.21.1 (the pack's pin); Thermoo needs it
ffapi_version = V9WdDUTx
# Create: Power Grid 0.6.1 (mc1.21.1)
powergrid_version = ip4gJrgx
# legendary-survival-overhaul 1.21.1-2.4.7.2 (phase 2)
lso_version = AZzEduN3
# project-atmosphere 0.9.1.2 (compileOnly only, never bundled).
# NOTE: Project Atmosphere is no longer published through api.modrinth.com at
# all -- the pack now pins it from CurseForge (project 1258344, file 8541023) --
# so there is no Modrinth maven coordinate to resolve and the jar comes from
# libs/ (see build.gradle). The file there is byte-identical to the pack's pin:
# sha1 a8e2c9b380623315b51e0c5bd4341080a2a45ab5.
#
# 0.9.1.2 is what unblocks the pack. 0.8.1.0's ServerLevelSnowStormMixin
# implemented com.Gabou.sereneseasonsplus.features.snowstorm.ISnowStormLevel,
# which Serene Seasons Plus deleted in 5.0, so ServerLevel could not load at all
# (see PLAN.md's PACK BLOCKER entry). 0.9.1.2's implements
# net.Gabou.gaboulibs.util.ISnowStormLevel, which Gabou's Libs 1.9 ships, and it
# declares sereneseasonsplus [5.1.1,) rather than being built against 4.x.
project_atmosphere_curseforge_file = 8541023
project_atmosphere_version_number  = 0.9.1.2
# create-crowns 2.2.5 (phase 3)
crowns_version = oXIJWFli

## Local / flatDir dependencies
# Destroy 1.21 port, built from mods/Destroy/a/b/c
destroy_version = 0.4.1
# Petrolpark library from the Destroy migration toolkit's local maven
petrolpark_library_version = 1.5.6

## Mod
mod_id          = mic_climate
mod_name        = MIC Climate
mod_version     = 0.1.0
mod_group_id    = com.minecraftindustrialcomplex
mod_authors     = Benjamin McIntyre
mod_license     = MIT
mod_description = One ambient temperature for the whole pack: feeds Project Atmosphere into Thermoo and makes Power Grid, Destroy and friends read it

## GameTest runtime only (phase 5) -- Modrinth version ids, verified 2026-09-05.
## None of these are compile dependencies; they exist so that `runGameTestServer`
## boots the same mod graph the pack ships, which is what makes the run a real
## proof that every mixin binds.
# Create 6.0.10 (FULL jar -- the ':slim' compile artifact has no jar-in-jar deps)
create_runtime_version = UjX6dr61
# architectury-api 13.0.8 (byte-identical to the pack's CurseForge pin)
architectury_version = 1IiqEQGl
# thermoo-patches (Serene Seasons -> Thermoo seasons)
thermoo_patches_version = KYaqnBiE
# YetAnotherConfigLib v3 -- thermoo-patches' config dependency
yacl_version = 7TVdVtxF
# serene-seasons + its GlitchCore dependency (glitchcore id from pack/mods/glitchcore.pw.toml)
sereneseasons_version = B6nTjh4b
glitchcore_version = S2TfWrZR
# serene-seasons-plus 5.1.2 -- the pack's pin, and now also what
# -PwithAtmosphere runs, because Project Atmosphere 0.9.1.2 wants [5.1.1,).
# Its gaboulibs dependency is CurseForge-only and comes from libs/.
sereneseasons_plus_version = nYao5aRK
# JEI 19.44.0.413 (the pack's pin). Client-only, and only for gametest-client.sh:
# Destroy's client setup registers JEI categories with a hard reference to
# mezz.jei.api, so a real client without JEI dies in Destroy's deferred work
# queue. The headless server never reaches that code and does not need it.
jei_version = 7JSZj45I
# Gabou's Libs 1.9 (the pack's pin, CurseForge project 1367332 file 8774265;
# sha1 aa39c5645c0479dbd7a485432e9694c78ad6082a). Project Atmosphere 0.9.1.2
# hard-requires [1.8.1,) and takes ISnowStormLevel from here.
gaboulibs_version_number = 1.9
# simple-clouds 0.7.3+1.21.1 (crackerslib is jar-in-jar). A hard dependency of
# Project Atmosphere 0.9.1.2 ([0.7.3,)), so -PwithAtmosphere needs it. The
# Modrinth artifact is the same file the pack pins from CurseForge
# (sha1 b796263392bb5fce4a3c77c45273af3a1e63423c).
simple_clouds_version = qpinHX2C
# FormicAPI 2.4.2 -- Create: CROWNS' library dependency
formicapi_version = KFLSWnM1
# The sibling addon, so Destroy's Vat carries a Power Grid ThermalBehaviour at
# runtime exactly as it does in the pack.
mic_destroy_electric_version = 1.0.0
